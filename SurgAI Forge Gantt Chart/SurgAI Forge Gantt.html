<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SurgAI Forge — Launch Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#FBF7F1; --panel:#ffffff; --panel2:#FCFAF6;
  --ink:#241F1B; --slate:#515A63; --slate2:#86807A;
  --line:#EBE4D8; --line2:#ECE9E3;
  --cardinal:#8C1515; --cardinal2:#B23A3A; --cardinal-soft:#F4E6E3; --band:#F6F1E8;
  --shadow: 0 8px 30px rgba(40,30,20,.13), 0 2px 8px rgba(40,30,20,.07);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  font-family:'Source Sans 3',system-ui,sans-serif; color:var(--ink);
  background:var(--bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
#root{ height:100vh; }
.mono{ font-variant-numeric:tabular-nums; letter-spacing:.1px; }
button{ font-family:inherit; cursor:pointer; }

.app{ height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ===== topbar ===== */
.topbar{ height:62px; flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; background:var(--panel); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:13px; }
.spark{ width:38px; height:38px; object-fit:contain; }
.brand-text{ line-height:1; }
.wordmark{ font-family:'Source Serif 4'; font-size:21px; font-weight:600; letter-spacing:.2px; }
.wordmark span{ color:var(--cardinal); }
.brand-sub{ font-size:11.5px; color:var(--slate2); letter-spacing:.3px; margin-top:5px; }
.topbar-right{ display:flex; align-items:center; gap:20px; }
.kpi{ display:flex; flex-direction:column; align-items:flex-end; line-height:1; }
.kpi-n{ font-family:'Source Serif 4'; font-size:19px; font-weight:600; }
.kpi-n.crit{ color:var(--cardinal); }
.kpi-l{ font-size:9.5px; text-transform:uppercase; letter-spacing:.9px; color:var(--slate2); margin-top:4px; }
.risk-btn{ display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 14px; white-space:nowrap;
  border:1px solid var(--line); background:var(--panel2); border-radius:8px; font-size:12.5px;
  font-weight:600; color:var(--ink); transition:.15s; }
.risk-btn:hover{ border-color:var(--cardinal2); background:var(--cardinal-soft); }
.warn-dot{ width:8px; height:8px; border-radius:50%; background:#C9A227; box-shadow:0 0 0 3px rgba(201,162,39,.18); }

/* ===== toolbar ===== */
.toolbar{ height:48px; flex:none; display:flex; align-items:center; gap:10px; padding:0 18px;
  background:var(--panel2); border-bottom:1px solid var(--line); font-size:12.5px; }
.tgroup{ display:flex; gap:6px; }
.tbtn{ height:30px; padding:0 12px; border:1px solid var(--line); background:var(--panel);
  border-radius:7px; font-size:12.5px; font-weight:500; color:var(--ink); transition:.13s; }
.tbtn:hover{ border-color:var(--slate2); }
.tbtn.ghost{ background:transparent; color:var(--slate); border-color:transparent; }
.tbtn.ghost:hover{ color:var(--cardinal); background:var(--cardinal-soft); }
.tbtn.toggle{ display:inline-flex; align-items:center; gap:7px; }
.tbtn.toggle .crit-dot{ width:8px; height:8px; border-radius:50%; background:var(--slate2); }
.tbtn.toggle.on{ border-color:var(--cardinal); background:var(--cardinal-soft); color:var(--cardinal); }
.tbtn.toggle.on .crit-dot{ background:var(--cardinal); }
.sep{ width:1px; height:24px; background:var(--line); }
.spacer{ flex:1; }
.seg{ display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line);
  border-radius:7px; padding:3px; background:var(--panel); }
.seg-label{ font-size:11px; color:var(--slate2); padding:0 8px; font-weight:600; letter-spacing:.2px; }
.seg-btn{ height:22px; padding:0 9px; border:none; background:transparent; border-radius:5px;
  font-size:11.5px; font-weight:600; color:var(--slate); text-transform:capitalize; }
.seg-btn:hover{ color:var(--ink); }
.seg-btn.on{ background:var(--ink); color:#fff; }
.seg.zoom .seg-btn{ font-size:15px; width:26px; padding:0; }
.seg.zoom .seg-label{ min-width:42px; text-align:center; }

/* ===== grid ===== */
.grid-scroll{ flex:1; overflow:auto; position:relative; background:var(--bg); }
.grid-inner{ position:relative; }

.axisbar{ position:sticky; top:0; z-index:30; display:flex; background:var(--panel);
  border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(0,0,0,.02); }
.axis-corner{ position:sticky; left:0; z-index:31; background:var(--panel);
  border-right:1px solid var(--line); display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 14px 9px; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--slate2); font-weight:600; }
.axis-time{ position:relative; }
.ax-month{ position:absolute; top:0; height:30px; display:flex; align-items:center; padding-left:11px;
  border-left:1px solid var(--line); }
.ax-month span{ font-family:'Source Serif 4'; font-size:14.5px; font-weight:600; color:var(--ink); }
.ax-month .ax-year{ font-style:normal; font-family:'Source Sans 3'; font-size:10px;
  color:var(--slate2); margin-left:7px; font-weight:500; letter-spacing:.4px; }
.ax-week{ position:absolute; top:31px; height:18px; display:flex; align-items:center; padding-left:5px;
  border-left:1px solid var(--line2); }
.ax-week span{ font-size:10px; color:var(--slate2); }
.ax-cap{ position:absolute; bottom:2px; font-size:9.5px; font-weight:700;
  white-space:nowrap; padding:1.5px 7px; border-radius:20px; letter-spacing:.2px; z-index:10; }
.ax-cap.launch{ background:var(--cardinal); color:#fff; transform:translateX(-90%); }
.ax-cap.handoff{ background:var(--ink); color:#fff; transform:translateX(-50%); }

.body{ position:relative; display:flex; }
.leftcol{ position:sticky; left:0; z-index:20; background:var(--panel); border-right:1px solid var(--line); }
.lc-sec{ display:flex; align-items:center; gap:9px; padding:0 14px; background:var(--band);
  border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
.lc-sec:hover{ background:#F2EBDF; }
.chev{ font-size:9px; color:var(--slate2); transition:transform .15s; width:9px; }
.chev.open{ transform:rotate(90deg); }
.lc-sw{ width:9px; height:9px; border-radius:2px; flex:none; }
.lc-sec-title{ font-family:'Source Serif 4'; font-size:14px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lc-count{ font-size:11px; color:var(--slate2); font-weight:600; }
.lc-task{ display:flex; align-items:center; gap:9px; padding:0 13px 0 31px; border-bottom:1px solid var(--line2);
  cursor:pointer; transition:background .1s; }
.lc-task:hover{ background:#FAF5ED; }
.lc-task.sel{ background:var(--cardinal-soft); box-shadow:inset 3px 0 0 var(--cardinal); }
.lc-id{ font-size:10.5px; font-weight:700; width:36px; flex:none; }
.lc-name{ flex:1; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#2D2722; }
.lc-ms{ color:var(--cardinal); margin-right:5px; font-size:9px; vertical-align:middle; }
.lc-crit{ width:6px; height:6px; border-radius:50%; background:var(--cardinal); flex:none; }
.lc-owner{ flex:none; }
.avatars{ display:inline-flex; align-items:center; }
.avatar{ border-radius:50%; background:var(--slate); color:#fff; font-size:8.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; border:1.5px solid var(--panel); }
.avatar.more{ background:var(--slate2); }

.timeline{ position:relative; }
svg.bg{ position:absolute; inset:0; pointer-events:none; }
svg.overlay{ position:absolute; inset:0; pointer-events:none; z-index:6; }

.bar{ position:absolute; border-radius:5px; cursor:grab; }
.bar:active{ cursor:grabbing; }
.bar-fill{ position:absolute; inset:0; border-radius:5px; background:var(--bc);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(0,0,0,.06); }
.bar.faded{ opacity:.26; filter:saturate(.45); }
.bar:hover .bar-fill{ box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 7px rgba(40,30,20,.18), inset 0 0 0 1px rgba(0,0,0,.08); }
.bar.sel{ z-index:4; }
.bar.sel .bar-fill{ box-shadow:0 0 0 2px var(--panel), 0 0 0 3.5px var(--bc), 0 3px 9px rgba(40,30,20,.2); }
.bar-crit-edge{ position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--cardinal);
  border-radius:5px 0 0 5px; z-index:1; }
.bar-h{ position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:3; }
.bar-h.l{ left:-2px; } .bar-h.r{ right:-2px; }
.bar-owner{ position:absolute; top:50%; transform:translateY(-50%); font-size:10px; color:var(--slate2);
  white-space:nowrap; pointer-events:none; font-weight:500; }

.today-band{ position:absolute; top:0; bottom:0; background:var(--cardinal); opacity:.07;
  pointer-events:none; z-index:1; }
.today-label{ position:absolute; top:6px; transform:translateX(-50%);
  background:var(--cardinal); color:#fff; font-size:10.5px; font-weight:700;
  padding:3px 10px; border-radius:20px; white-space:nowrap; z-index:9;
  box-shadow:0 2px 8px rgba(140,21,21,.4); pointer-events:none;
  letter-spacing:.2px; border:1.5px solid rgba(255,255,255,.5); }
.today-label::after{ content:''; position:absolute; top:100%; left:50%;
  transform:translateX(-50%); border:5px solid transparent;
  border-top-color:var(--cardinal); }
.today{ position:absolute; top:0; bottom:0; width:3px; background:var(--cardinal); z-index:8;
  box-shadow: 0 0 0 3px var(--cardinal-soft), 2px 0 12px rgba(140,21,21,.25); }
.marker{ position:absolute; top:0; bottom:0; z-index:5; }
.marker.handoff{ border-left:2px dashed #6E6660; }
.marker.launch{ border-left:2px solid var(--cardinal); }

/* ===== legend ===== */
.legend{ height:40px; flex:none; display:flex; align-items:center; gap:20px; padding:0 22px;
  background:var(--panel); border-top:1px solid var(--line); font-size:11.5px; color:var(--slate); }
.lg-item{ display:inline-flex; align-items:center; gap:7px; }
.lg-bar{ width:22px; height:11px; border-radius:3px; background:var(--slate); }
.lg-dia{ color:var(--cardinal); font-size:11px; }
.lg-crit{ width:14px; height:11px; border-radius:3px; background:var(--cardinal); }
.lg-today{ width:2px; height:13px; background:var(--cardinal); }
.lg-hand{ width:0; height:14px; border-left:2px dashed #6E6660; }
.lg-launch{ width:0; height:14px; border-left:2px solid var(--cardinal); }
.lg-spacer{ flex:1; }
.lg-hint{ color:var(--slate2); font-size:11px; }

/* ===== tooltip ===== */
.tooltip{ position:fixed; z-index:200; width:286px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow); padding:13px 14px; pointer-events:none; }
.tt-head{ display:flex; align-items:flex-start; gap:8px; margin-bottom:9px; }
.tt-chip{ font-size:10px; font-weight:700; color:#fff; padding:2px 6px; border-radius:5px; flex:none; font-variant-numeric:tabular-nums; }
.tt-name{ font-family:'Source Serif 4'; font-size:14px; font-weight:600; line-height:1.25; }
.tt-crit{ font-size:10.5px; font-weight:700; color:var(--cardinal); margin-bottom:8px; letter-spacing:.2px; }
.tt-grid{ display:grid; grid-template-columns:auto 1fr; gap:5px 12px; margin:0; font-size:12px; }
.tt-grid dt{ color:var(--slate2); font-weight:600; }
.tt-grid dd{ margin:0; color:var(--ink); }
.tt-notes{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line2); font-size:11.5px; color:var(--slate); font-style:italic; }

/* ===== drawer ===== */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:380px; background:var(--panel);
  border-left:1px solid var(--line); box-shadow:var(--shadow); z-index:150; display:flex; flex-direction:column;
  animation:slideIn .22s cubic-bezier(.2,.7,.3,1); }
.drawer.risks{ width:440px; }
@keyframes slideIn{ from{ transform:translateX(24px); opacity:0; } to{ transform:none; opacity:1; } }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 14px; border-bottom:1px solid var(--line); }
.drawer-eyebrow{ display:flex; align-items:center; gap:8px; font-size:11px; text-transform:uppercase;
  letter-spacing:.9px; color:var(--slate2); font-weight:700; }
.drawer-eyebrow .sw{ width:10px; height:10px; border-radius:3px; }
.icon-btn{ width:28px; height:28px; border:none; background:transparent; border-radius:7px; color:var(--slate2); font-size:13px; }
.icon-btn:hover{ background:var(--band); color:var(--ink); }
.drawer-body{ flex:1; overflow:auto; padding:18px; }
.drawer-id{ font-size:11px; font-weight:700; color:var(--slate2); margin-bottom:14px; letter-spacing:.4px; }
.field{ display:block; margin-bottom:14px; }
.field-label{ display:block; font-size:11px; font-weight:600; color:var(--slate); margin-bottom:5px; letter-spacing:.2px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.inp{ width:100%; height:34px; padding:0 10px; border:1px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13px; color:var(--ink); background:var(--panel2); transition:.13s; }
.inp:focus{ outline:none; border-color:var(--cardinal2); background:#fff; box-shadow:0 0 0 3px var(--cardinal-soft); }
.inp.readonly{ display:flex; align-items:center; color:var(--slate2); background:var(--band); }
.inp.ta{ height:auto; padding:8px 10px; resize:vertical; line-height:1.45; }
.dep-hint{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.dep-pill{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; background:var(--band); color:var(--slate); }
.dep-pill.bad{ background:var(--cardinal-soft); color:var(--cardinal); }
.toggles{ display:flex; gap:8px; margin-top:4px; }
.pill-toggle{ flex:1; height:36px; border:1px solid var(--line); background:var(--panel2); border-radius:9px;
  font-size:12px; font-weight:600; color:var(--slate); transition:.13s; }
.pill-toggle:hover{ border-color:var(--slate2); }
.pill-toggle.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
.pill-toggle.on.crit{ border-color:var(--cardinal); background:var(--cardinal); }
.drawer-foot{ display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); }
.btn{ height:38px; border-radius:9px; font-size:13px; font-weight:600; border:1px solid transparent; flex:1; }
.btn.solid{ background:var(--ink); color:#fff; }
.btn.solid:hover{ background:#3a322b; }
.btn.ghost{ background:transparent; border-color:var(--line); color:var(--slate); flex:none; padding:0 14px; }
.btn.ghost.danger:hover{ color:var(--cardinal); border-color:var(--cardinal2); background:var(--cardinal-soft); }

/* ===== risks ===== */
.risks-summary{ display:flex; gap:8px; padding:14px 18px 4px; }
.rc{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
.rc.high{ background:var(--cardinal-soft); color:var(--cardinal); }
.rc.med{ background:#FaF0D8; color:#8A6D14; }
.rc.low{ background:var(--band); color:var(--slate); }
.risks-intro{ padding:6px 18px 10px; margin:0; font-size:12px; color:var(--slate); line-height:1.5; }
.risks-list{ flex:1; overflow:auto; padding:0 14px 16px; }
.risk-item{ display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel2);
  border-radius:10px; padding:11px 13px; margin-bottom:8px; transition:.13s; }
.risk-item:hover{ border-color:var(--slate2); background:#fff; transform:translateX(-2px); }
.risk-item.sev-high{ border-left:3px solid var(--cardinal); }
.risk-item.sev-med{ border-left:3px solid #C9A227; }
.risk-item.sev-low{ border-left:3px solid var(--slate2); }
.risk-top{ display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.risk-sev{ font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; padding:1.5px 6px; border-radius:4px; }
.risk-sev.high{ background:var(--cardinal); color:#fff; }
.risk-sev.med{ background:#C9A227; color:#fff; }
.risk-sev.low{ background:var(--slate2); color:#fff; }
.risk-type{ font-size:11.5px; font-weight:600; color:var(--ink); flex:1; }
.risk-task{ font-size:10.5px; font-weight:700; color:var(--slate2); }
.risk-msg{ font-size:11.5px; color:var(--slate); line-height:1.45; }
</style>
</head>
<body>

    <rect x="8" y="24" width="22" height="3" rx="1.5" fill="#3F6E9A" opacity=".7"/>
    <rect x="8" y="30" width="32" height="3" rx="1.5" fill="#4F7A6B" opacity=".7"/>
    <rect x="8" y="36" width="20" height="3" rx="1.5" fill="#6E6088" opacity=".7"/>
